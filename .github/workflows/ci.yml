name: CI

on:
  push:
    branches:
      - master
      - "perf/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting for changed files
        shell: bash
        run: |
          mapfile -t changed_files < <(git diff --name-only origin/master...HEAD -- '*.md' '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.json' '*.yml' '*.yaml')
          if ((${#changed_files[@]} > 0)); then
            pnpm exec oxfmt --check "${changed_files[@]}"
          fi

      - name: Test all workspace packages
        run: pnpm test

      - name: Type-check framework packages
        run: pnpm typecheck

      - name: Build the Vynn SSR sandbox
        run: pnpm build
